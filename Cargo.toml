[package]
name = "driver_leapfrog"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimal SteamVR driver: Ultraleap hands as hand-tracking devices"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
leap-sys = "0.2"
glam = "0.29"

[features]
# cargo test on the build host: stubs instead of the shim and LeapC
host-stubs = []

[build-dependencies]
cc = "1"

[profile.release]
debug = 1
