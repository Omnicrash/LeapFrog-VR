[package]
name = "driver_leapfrog"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Minimal SteamVR driver: Ultraleap hands as hand-tracking devices"
publish = false

[workspace]
members = ["watchdog", "setup"]
exclude = ["handmodel"]

[lib]
crate-type = ["cdylib"]

[dependencies]
leap-sys = "0.2"
glam = "0.29"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Services", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[features]
# cargo test on the build host: stubs instead of the shim and LeapC
host-stubs = []

[build-dependencies]
cc = "1"

[profile.release]
debug = 1
