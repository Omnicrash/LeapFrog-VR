[package]
name = "leapfrog-setup"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Installs, registers and removes the LeapFrog SteamVR driver"
publish = false

[dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry"] }
