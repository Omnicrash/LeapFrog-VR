[package]
name = "leapfrog-register"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Registers the LeapFrog SteamVR driver folder, sets up the service, and takes it out again; the engine behind the installer"
publish = false

[dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization"] }
